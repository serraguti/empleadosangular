<div>
    <h1>Home empleados</h1>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Id empleado</th>
                <th>Apellido</th>
                <th>Oficio</th>
                <th>Salario</th>
            </tr>
        </thead>
        <tbody>
            @for (emp of empleados; track emp){
                <tr>
                    <td>{{emp.idEmpleado}}</td>
                    <td>{{emp.apellido}}</td>
                    <td>{{emp.oficio}}</td>
                    <td>{{emp.salario}}</td>
                </tr>
            }
        </tbody>
    </table>
</div>
