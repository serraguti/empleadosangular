<div>
    <h2>Empleados oficio</h2>
    <form #empleadosForm="ngForm">
        <label>Seleccione un oficio</label>
        <select name="selectoficio" #selectoficio
        class="form-control">
            @for (ofi of oficios; track ofi){
                <option>{{ofi}}</option>
            }
        </select>
        <button (click)="showEmpleados()" class="btn btn-success">
            Show empleados
        </button>
    </form>
    @if (empleados){
        <table class="table table-info">
            <thead>
                <tr>
                    <th>Id empleado</th>
                    <th>Apellido</th>
                    <th>Oficio</th>
                    <th>Salario</th>
                </tr>
            </thead>
            <tbody>
                @for (emp of empleados; track emp){
                    <tr>
                        <td>{{emp.idEmpleado}}</td>
                        <td>{{emp.apellido}}</td>
                        <td>{{emp.oficio}}</td>
                        <td>{{emp.salario}}</td>
                    </tr>
                }
            </tbody>
        </table>        
    }
</div>
